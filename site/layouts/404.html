<div class="not-found-page">

    <h1>페이지를 찾을 수 없습니다</h1>

    <a class="not-found-home" href="{{ site.Home.Permalink }}">홈으로 돌아가기</a>
</div>
{{- end }}{{/* end main */ -}}
