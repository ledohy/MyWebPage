{{- /* PaperMod 404.html 재정의: 숫자만 있던 화면에 안내 문구와 홈 링크 추가 */ -}}
{{- define "main" }}
<div class="not-found-page">
    <p class="not-found-code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The address may be wrong, or the page doesn't exist.</p>
    {{- /* 404 페이지는 아무 경로에서나 열리므로 상대경로가 아닌 전체 주소로 홈을 가리킨다 */}}
    <a class="not-found-home" href="{{ site.Home.Permalink }}">Back to home</a>
</div>
{{- end }}{{/* end main */ -}}
